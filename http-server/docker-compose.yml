version: "3.8"

services:
  db:
    container_name: "workoutDB"
    image: postgres:12.4-alpine
    volumes:
      - "./database/postgres-data:/var/lib/postgresql/data:rw"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: "workout"
      POSTGRES_USER: "ousta"
      POSTGRES_PASSWORD: "Password12"
    restart: unless-stopped

